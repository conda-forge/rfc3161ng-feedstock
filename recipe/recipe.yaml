schema_version: 1

context:
  name: rfc3161ng
  version: "2.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/rfc3161ng-${{ version }}.tar.gz
  sha256: 1e88614da61b22abd591577f9dd39d3a030335f9e8a12d8bc001149c17d0a01e

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pyasn1
    - python-dateutil
    - pyasn1-modules
    - requests
    - cryptography

tests:
  - python:
      imports:
        - rfc3161ng
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Python implementation of the RFC3161 specification, using pyasn1
  license: MIT
  license_file: LICENSE
  homepage: https://dev.entrouvert.org/projects/python-rfc3161

extra:
  recipe-maintainers:
    - jan-janssen
